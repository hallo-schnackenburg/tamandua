name = "tamandua-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
MODEL = "claude-haiku-5-5"

GEOCODE_COUNTRIES = "de"
GEOCODE_USER_AGENT = "tamandua"

GITHUB_CLIENT_ID = "Iv23lio7AFNsecVWdaph"
DATA_REPO = "hallo-schnackenburg/archive-dev"
BASE_BRANCH = "main"
APP_URL = "http://localhost:5173"



# The hub that tells every open browser that the archive changed (src/hub.ts). Bindings and migrations are not
# inherited by [env.*]: every environment declares its own.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[env.staging]
workers_dev = false

[[env.staging.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[env.staging.vars]
ALLOWED_ORIGIN = "https://tamandua-staging.schnackenburg.de"
MODEL = "claude-haiku-5-5"

GEOCODE_COUNTRIES = "de"
GEOCODE_USER_AGENT = "tamandua"

GITHUB_CLIENT_ID = "Iv23lib3wO6Gt7ulIeHo"
DATA_REPO = "hallo-schnackenburg/archive-staging"
BASE_BRANCH = "main"
APP_URL = "https://tamandua-staging.schnackenburg.de"

S3_ENDPOINT = "https://nbg1.your-objectstorage.com"
S3_BUCKET = "schnackenburg-archiv-staging"



[env.production]
workers_dev = false

[[env.production.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[env.production.vars]
ALLOWED_ORIGIN = "https://tamandua.schnackenburg.de"
MODEL = "claude-haiku-5-5"

GEOCODE_COUNTRIES = "de"
GEOCODE_USER_AGENT = "tamandua"

GITHUB_CLIENT_ID = "Iv23liWYRPKzPydARzCg"
DATA_REPO = "hallo-schnackenburg/archive"
BASE_BRANCH = "main"
APP_URL = "https://tamandua.schnackenburg.de"

S3_ENDPOINT = "https://nbg1.your-objectstorage.com"
S3_BUCKET = "schnackenburg-archiv-production"
