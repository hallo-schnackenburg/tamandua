name = "archive-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Which page may call the Worker from a browser. Local development only.
ALLOWED_ORIGIN = "http://localhost:5173"
MODEL = "claude-haiku-5-5"

# Coordinate lookup (OpenStreetMap Nominatim): countries to search in (empty: everywhere) and the
# User-Agent it needs; name the application and how to reach you, e.g. "archive-capture (you@example.org)".
GEOCODE_COUNTRIES = "de"
GEOCODE_USER_AGENT = "archive-capture"

# Secrets are not written here:
#   local:       worker/.dev.vars          (ANTHROPIC_API_KEY, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID,
#                                           S3_SECRET_ACCESS_KEY; not in git, see .dev.vars.example)
#   deployed:    npx wrangler secret put ANTHROPIC_API_KEY   (and likewise for the S3_* values)
