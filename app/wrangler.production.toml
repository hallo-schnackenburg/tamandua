# The Pages project for production: the built app (dist/) plus the Function in functions/api/.
# Deployed with `npm run deploy:production --workspace app`.
name = "tamandua-production"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

# The Function calls the production Worker through this binding (see functions/api/[[path]].ts).
# The Worker has to be deployed first.
[[services]]
binding = "WORKER"
service = "tamandua-worker-production"
